notes:
  - >-
    The Campaign Management API is listed in the docs sidebar at
    /advertiser/campaign-management-api but the page is an empty stub — a
    title and nothing else. It is advertised but not documented, so no spec
    was written for it.
  - >-
    Same shape at /publisher/rewarded-server-to-server-integration and
    /advertiser/events-integration/ — sidebar entries whose pages render a
    heading and no body. The rewarded SSV callback is real (Android SDK 2.4.0,
    2026-01-11 added "SSV callback support for incentivized ads"), which means
    Opera DOES send a server-to-server verification request out to a
    publisher-configured endpoint, but its contract — URL registration,
    parameters, signature — is nowhere in the public docs. No Webhooks
    pointer was emitted, because the callback is not documented well enough to
    describe.
