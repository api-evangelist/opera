- aid: opera:opera-file-upload-api
  name: Opera Ads File Upload API
  description: >-
    Resumable large-file upload implementing the TUS 1.0.0 protocol, with
    API-key or HMAC-SHA256 authentication, 4 GB maximum file size, 256 MB
    chunk ceiling and 7-day session expiry. The upload host is issued per
    customer by the Opera Ads team.
  humanURL: https://doc.adx.opera.com/advertiser/file_upload_api
  baseURL: https://{host}/upload
