aid: opera
name: Opera
description: >-
  Opera is the Norway-based maker of the Opera, Opera GX, and Opera Mini web
  browsers and operator of the Opera Ads advertising and monetization platform.
  Opera Ads exposes a public Open API for advertisers (daily campaign reporting
  and server-to-server conversion events) and for publishers (app and placement
  inventory management), alongside Android/iOS ad SDKs, an OpenRTB/ADX exchange,
  first-party Go client and protocol libraries, and a self-serve Opera Ad
  Manager. API authentication is via a bearer token issued by Opera Ads.
