aid: opera
name: Opera
description: >-
  Opera is the Norway-based, Nasdaq-listed (OPRA) maker of the Opera, Opera GX,
  Opera Air, Opera Mini and Opera Neon web browsers, and the operator of the
  Opera Ads advertising and monetization platform. Opera Ads exposes six
  documented HTTP APIs: an advertiser Report API for daily campaign
  performance, a publisher Inventory Management API for apps and placements, a
  publisher OFP Report API for revenue and delivery, an ADX DSP Report API for
  exchange performance, a server-to-server Marketing API for conversion
  postbacks, and a TUS 1.0.0 resumable File Upload API. Around them sit
  Android and iOS ad SDKs with mediation adapters for AdMob, AppLovin MAX,
  TopOn, TradPlus and LevelPlay, an OpenRTB/ADX exchange with Prebid.js and
  Prebid Server adapters, a web JS ad tag, first-party Go OpenRTB and VAST
  libraries, and the self-serve Opera Ad Manager console. Authentication
  differs per API — bearer token, token query parameter, X-API-Key or HMAC
  signature — and every credential is issued by contacting Opera Ads.
