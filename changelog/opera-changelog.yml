source: >-
  https://doc.adx.opera.com/publisher/app/sdk/android/release-note/ +
  https://doc.adx.opera.com/publisher/app/sdk/ios/release-note/
note: >-
  Opera Ads publishes dated release notes for the two publisher SDKs and
  nothing else. There is NO changelog for the HTTP APIs — the Report,
  Inventory, OFP Report, DSP Report, Marketing and File Upload references
  carry no version history, no dated entries and no "what's new". The File
  Upload API is the one HTTP surface that states a version at all ("Version:
  1.0.0 — Initial release"). Recent window only; the SDK notes go back to the
  2.0.0 refactor of 2025-11-05.
scheme:
  sdks: semver, dated release notes per version
  http_apis: uri-path major version (v1); no dated changelog published
current:
  android_sdk: 2.14.0
  ios_sdk: '2.12.1'
  file_upload_api: 1.0.0
