  Opera Ads ships NO MCP server, the tool side of this crosswalk is our own
  derived candidate list rather than a live tools/list response — so every
  binding is 1:1 and confidence is high by construction, and the value of this
  file is the REST-side coverage picture, not tool discovery. There is no
